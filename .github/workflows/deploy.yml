name: Deploy Daily Sorte & AstroEngine

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_NAME: daily-sorte-astroengine
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  migrate:
    name: Run database migrations
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    # Only migrate real environments, never from pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply Supabase migrations
        run: npm run migrate
        env:
          # Preferred: full Postgres connection string.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Fallback: the runner builds the URL from these two.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  infrastructure:
    needs: docker-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Configure Docker Compose
        run: |
          # Deploy Docker Compose services
          docker-compose -f docker-compose.yml up -d
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ env.SUPABASE_SECRET_KEY }}
          SUPABASE_JWKS_URL: ${{ env.SUPABASE_JWKS_URL }}

      - name: Wait for services to be ready
        run: |
          # Wait for Keycloak
          echo "Waiting for Keycloak..."
          until curl -s http://localhost:8080/realms/master/.well-known/openid-configuration; do
            echo "Keycloak not ready, waiting..."
            sleep 5
          done
          
          # Wait for Kong
          echo "Waiting for Kong..."
          until curl -s http://localhost:8000; do
            echo "Kong not ready, waiting..."
            sleep 5
          done

      - name: Verify Keycloak configuration
        run: |
          echo "Keycloak realm configuration verified"
          curl -s http://localhost:8080/admin/realms

      - name: Verify Kong configuration
        run: |
          echo "Kong services verified"
          curl -s http://localhost:8000/services

  deploy:
    needs: [infrastructure, migrate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          echo "Application deployment complete"
          # Additional deployment steps can be added here