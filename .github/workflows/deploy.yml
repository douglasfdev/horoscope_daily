name: Deploy Daily Sorte & AstroEngine

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_NAME: daily-sorte-astroengine
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  migrate:
    name: Run database migrations
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    # Only migrate real environments, never from pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply Supabase migrations
        run: npm run migrate
        env:
          # Preferred: full Postgres connection string.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Fallback: the runner builds the URL from these two.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  infrastructure:
    needs: docker-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Configure Docker Compose
        run: |
          # Deploy Docker Compose services
          docker-compose -f docker-compose.yml up -d
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ env.SUPABASE_SECRET_KEY }}
          SUPABASE_JWKS_URL: ${{ env.SUPABASE_JWKS_URL }}

      - name: Wait for services to be ready
        run: |
          # Wait for Keycloak
          echo "Waiting for Keycloak..."
          until curl -s http://localhost:8080/realms/master/.well-known/openid-configuration; do
            echo "Keycloak not ready, waiting..."
            sleep 5
          done
          
          # Wait for Kong
          echo "Waiting for Kong..."
          until curl -s http://localhost:8000; do
            echo "Kong not ready, waiting..."
            sleep 5
          done

      - name: Verify Keycloak configuration
        run: |
          echo "Keycloak realm configuration verified"
          curl -s http://localhost:8080/admin/realms

      - name: Verify Kong configuration
        run: |
          echo "Kong services verified"
          curl -s http://localhost:8000/services

  deploy:
    needs: [infrastructure, migrate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PORT: ${{ secrets.PORT }}
          HOST: ${{ secrets.HOST }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          KEYCLOAK_ISSUER: ${{ secrets.KEYCLOAK_ISSUER }}
          KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          REDIS_URI: ${{ secrets.REDIS_URI }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          NODE_ENV: production
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.docker-build.outputs.image_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          envs: DIRECT_URL,DATABASE_URL,APP_BASE_URL,SESSION_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,WOOVI_API_KEY,WOOVI_API_BASE_URL,GITHUB_ACTOR,GITHUB_TOKEN,IMAGE_NAME
          script: |
            set -e

            sudo mkdir -p /var/www/daily-sorte
            sudo chown -R $USER:$USER /var/www/daily-sorte
            cd /var/www/daily-sorte

            # Extrai só a tag :latest da lista de tags (pode vir múltiplas)
            FULL_IMAGE=$(echo "$IMAGE_NAME" | tr ',' '\n' | grep ':latest')

            # Grava o .env
            printf 'NODE_ENV=production\n'                       > .env
            printf 'PORT=3000\n'                                >> .env
            printf 'DIRECT_URL=%s\n'           "$DIRECT_URL"   >> .env
            printf 'DATABASE_URL=%s\n'         "$DATABASE_URL" >> .env
            printf 'APP_BASE_URL=%s\n'         "$APP_BASE_URL" >> .env
            printf 'SESSION_SECRET=%s\n'       "$SESSION_SECRET" >> .env

            # Grava o docker-compose.yml usando a imagem correta
            cat > docker-compose.yml << COMPOSE
            services:
              api:
                image: ${FULL_IMAGE}
                container_name: daily-sorte
                restart: unless-stopped
                ports:
                  - "3000:3000"
                env_file:
                  - .env
                environment:
                  NODE_ENV: production
                  PORT: "3000"
                healthcheck:
                  test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 15s
            COMPOSE

            # Login no GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull e recria o container
            docker pull "${FULL_IMAGE}"
            docker compose down --remove-orphans 2>/dev/null || true
            docker compose up -d

            # Limpa imagens antigas
            docker image prune -f

            echo "✅ Deploy concluído."
            docker compose ps