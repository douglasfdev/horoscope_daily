version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: daily-sorte-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: daily-sorte-astro
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - astro-network

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.3
    container_name: daily-sorte-keycloak
    command: start-dev --http-port=8080 --db-url postgres://admin:admin123@postgres:5432/daily-sorte-astro --log-level=DEBUG
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_POSTGRES_DB: daily-sorte-astro
      KC_POSTGRES_USER: admin
      KC_POSTGRES_PASSWORD: admin123
      KC_POSTGRES_URL: postgres://admin:admin123@postgres:5432/daily-sorte-astro
      KC_LOG_LEVEL: DEBUG
    networks:
      - astro-network
    depends_on:
      - postgres

  kong:
    image: kong:3.5
    container_name: daily-sorte-kong
    ports:
      - "8443:8443"
      - "8000:8000"
    environment:
      KONG_DATABASE: "postgres"
      KONG_DATABASE_HOST: postgres
      KONG_DATABASE_DATABASE: daily-sorte-astro
      KONG_DATABASE_USERNAME: admin
      KONG_DATABASE_PASSWORD: admin123
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ERROR_LOG: "/dev/stdout"
      KONG_NGINX_ANNOTATIONS_CONFIG: |
        {{ range .Service .Labels }}{{-/* Kong will generate its own ingress/egress. This config can be used to define custom Nginx annotations or additional snippets. */}}-}
    networks:
      - astro-network
    depends_on:
      - postgres

networks:
  astro-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
