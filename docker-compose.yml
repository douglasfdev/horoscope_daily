version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: daily-sorte-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: daily-sorte-astro
    networks:
      - astro-network

  redis:
    image: redis:7-alpine
    container_name: daily-sorte-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - astro-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: daily-sorte-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    networks:
      - astro-network

networks:
  astro-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local