version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.3
    container_name: daily-sorte-keycloak
    command: start-dev --http-port=8080 --db-url postgresql://postgres:${SUPABASE_SECRET_KEY}@db.mqvdmubywuvnyjpqncey.supabase.co:5432/postgres --log-level=DEBUG
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgresql
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SUPABASE_SECRET_KEY}
      POSTGRES_HOST: db.mqvdmubywuvnyjpqncey.supabase.co
      POSTGRES_PORT: 5432
      KC_LOG_LEVEL: DEBUG
    networks:
      - astro-network

  kong:
    image: kong:3.5
    container_name: daily-sorte-kong
    ports:
      - "8443:8443"
      - "8000:8000"
    environment:
      KONG_DATABASE: "postgres"
      KONG_DATABASE_HOST: db.mqvdmubywuvnyjpqncey.supabase.co
      KONG_DATABASE_DATABASE: keycloak
      KONG_DATABASE_USERNAME: postgres
      KONG_DATABASE_PASSWORD: ${SUPABASE_SECRET_KEY}
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ERROR_LOG: "/dev/stdout"
      KONG_NGINX_ANNOTATIONS_CONFIG: |
        {{ range .Service .Labels }}{{-/* Kong will generate its own ingress/egress. This config can be used to define custom Nginx annotations or additional snippets. */}}-}
    networks:
      - astro-network

  app:
    build: .
    container_name: daily-sorte-api
    ports:
      - "3333:3333"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - REDIS_URI=${REDIS_URI}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - NODE_ENV=${NODE_ENV}
      - PORT=3333
    depends_on:
      - keycloak
      - kong
    networks:
      - astro-network

networks:
  astro-network:
    driver: bridge